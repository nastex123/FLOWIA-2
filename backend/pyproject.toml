[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flowmind-backend"
version = "0.1.0"
description = "FlowMind AI Backend - Pure library-based intelligent document processing"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.28",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    "redis>=5.0.3",
    "python-multipart>=0.0.9",
    "pandas>=2.2.1",
    "openpyxl>=3.1.2",
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    "scikit-learn>=1.4.1",
    "rapidfuzz>=3.6.1",
    "regex>=2023.12.25",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.5",
    "httpx>=0.27.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]
